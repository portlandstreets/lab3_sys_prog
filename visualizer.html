<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Візуалізація AST дерева (D3.js)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #fdfdfd; }
    .node circle { fill: #4CAF50; stroke: #2E7D32; stroke-width: 2px; }
    .node text { font: 13px sans-serif; font-weight: bold; }
    .link { fill: none; stroke: #aaa; stroke-width: 1.5px; }
    #tree-container { border: 1px solid #ccc; background: #fff; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Візуалізація дерева абстрактного синтаксису (AST)</h2>
  <div id="tree-container"></div>

  <script>
    fetch('ast_data.json')
      .then(res => res.json())
      .then(treeData => {
        const width = 1100, height = 750;
        const svg = d3.select("#tree-container")
                      .append("svg")
                      .attr("width", width)
                      .attr("height", height)
                      .append("g")
                      .attr("transform", "translate(60,40)");

        const tree = d3.tree().size([width - 150, height - 120]);
        const root = d3.hierarchy(treeData);
        tree(root);

        svg.selectAll(".link")
           .data(root.links())
           .enter().append("path")
           .attr("class", "link")
           .attr("d", d3.linkVertical()
                        .x(d => d.x)
                        .y(d => d.y));

        const node = svg.selectAll(".node")
                        .data(root.descendants())
                        .enter().append("g")
                        .attr("class", "node")
                        .attr("transform", d => `translate(${d.x},${d.y})`);

        node.append("circle").attr("r", 7);
        node.append("text")
            .attr("dy", -10)
            .attr("text-anchor", "middle")
            .text(d => d.data.name);
      })
      .catch(err => {
        document.getElementById('tree-container').innerText =
          "Помилка завантаження ast_data.json. Переконайтеся, що ви згенерували файл через c_compiler.py та запустили сторінку (наприклад, через live-server або python -m http.server).";
      });
  </script>
</body>
</html>
